name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:            # own PRs publish a pr-<number> tag to test; Dependabot PRs only build
  schedule:
    - cron: "17 9 * * 1"   # weekly rebuild picks up Debian security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dependabot and fork PRs get a read-only token, so they can't push.
      PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64        # Brother only ships x86 drivers
          pull: true                    # always start from the newest base image
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'schedule' }}  # force apt upgrades on the weekly run
