# Add this service to your existing paperless-ngx compose file (under `services:`) and the
# `networks:` block at the bottom (top level). Set the ${...} variables in your .env file.
# The volume must be the SAME host folder your webserver mounts at /usr/src/paperless/consume.

services:
  brscan:
    image: ghcr.io/calabresemic/brscan-paperless:latest
    container_name: brscan
    restart: unless-stopped
    # The printer sends button presses to <BRSCAN_IP>:54925/udp. macvlan gives the container
    # its own IP on the printer's network. See README "Networking" for bridge/host instead.
    networks:
      brscan_macvlan:
        ipv4_address: ${BRSCAN_IP}
    environment:
      SCANNER_IP: ${SCANNER_IP}
      # SKEY_HOST_IP:           # address registered with the printer; auto-detected (= BRSCAN_IP here)
      SCANNER_MODEL: MFC-L2690DW
      SKEY_NAME: Paperless-ngx  # name on the printer display (keep it short, max ~15 chars)
      SCAN_RESOLUTION: 300
      SCAN_MODE: True Gray
      SCAN_SOURCE: Automatic Document Feeder(left aligned)   # L2690DW ADF is single-sided
      BLANK_REMOVAL: "true"     # mostly a safety net without duplex; "false" to disable
      BLANK_THRESHOLD: "0.01"
      PUID: 1000                # match USERMAP_UID / USERMAP_GID of paperless
      PGID: 1000
      TZ: Etc/UTC               # set to your time zone
    volumes:
      - ./consume:/output

networks:
  brscan_macvlan:
    driver: macvlan
    driver_opts:
      parent: ${BRSCAN_PARENT}  # host interface on the printer's network (a VLAN interface works)
    ipam:
      config:
        - subnet: ${BRSCAN_SUBNET}
          gateway: ${BRSCAN_GATEWAY}
